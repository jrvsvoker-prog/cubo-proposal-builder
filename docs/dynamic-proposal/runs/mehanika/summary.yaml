# G1a · сводка «как я понял бизнес» — автосервис «Механика»

> Шаги 0–4 builder-pipeline. Ресёрч: сайта нет — работаем по типовой модели
> ниши, всё помечено допущениями. Названия услуг — типовая лексика ниши
> (разрешены как «названия и лексика»), цифры — демонстрационные.

```yaml
company:
  name: "Механика"
  displayName: "Автосервис «Механика»"
  activity: "Сеть автосервисов: ремонт и обслуживание легковых авто и малых корпоративных парков"
  brand: { logo: null, primary: "#0369a1", site: null }
  slug: mehanika

archetype: service                 # единица продажи — заказ-наряд: заявка + работа + срок
archetype_assumption: false

units:
  kind: "Точка"
  names: ["Каширская", "Дмитровская", "Профсоюзная", "Ярославская"]
  assumption: true                 # адресов нет — названы по адресному принципу

customer:
  singular: "Заказчик"             # пользователь кабинета и получатель подборок
  entity: "Заказ"                  # главная сущность карточки (03) и записей (04)
  entityExample: { name: "Заказ № 2187 · Гелиос", chips: ["Ремонт трансмиссии", "Профсоюзная"] }

offer:
  itemNoun: "Услуга"
  items: ["Диагностика", "Плановое ТО", "Ремонт подвески", "Ремонт трансмиссии", "Кузовной ремонт"]
  priceUnit: "₽ / заказ"
  priceRange: [8000, 60000]        # assumption: типовой диапазон ниши

deal:
  noun: "Заказ"                    # одна продажа = заказ-наряд
  pipeline: ["Заявка", "Диагностика", "Согласование", "В работе"]

time:
  demoDate: "2026-09-13"

scale:
  monthlyDeals: 640                # assumption: 4 точки × ~160 заказов/мес
  avgDeal: 21000                   # assumption

assumptions:
  - "названия точек — по адресному принципу, адресов не дали"
  - "услуги и цены — типовые для ниши"
  - "масштаб: 4 точки × ~160 заказов в месяц"

jobs:
  main: "When закрывается месяц, I want to сравнить точки по выручке и загрузке постов, so I can увидеть отстающую точку и перераспределить записи"
  roles:
    - role: "Руководитель сети"
      stories:
        - when: "закрывается месяц"
          want: "сравнить точки по выручке и загрузке постов"
          so: "увидеть отстающую точку и перераспределить записи"
          metrics: ["revenue", "load"]
          screens: ["01", "02"]
        - when: "растут повторные ремонты"
          want: "видеть долю повторных обращений по точкам"
          so: "найти точку с плохим качеством работ"
          metrics: ["repeat"]
          screens: ["02"]
    - role: "Мастер-приёмщик"
      stories:
        - when: "накопились заказы"
          want: "видеть очередь по стадиям с суммами"
          so: "понимать, кого двигать и что согласовать"
          metrics: ["orders"]
          screens: ["04"]
        - when: "заказчик спрашивает про срок"
          want: "видеть статус и следующий шаг по заказу рядом"
          so: "отвечать без обхода постов"
          metrics: ["ontime"]
          screens: ["03"]
    - role: "Механик"
      stories:
        - when: "заканчивается предыдущий заказ"
          want: "видеть следующий заказ и его историю"
          so: "начать работу без простоя поста"
          metrics: []                      # история, не число (как «Куратор» в §2.2)
          screens: ["03"]
    - role: "Заказчик"
      stories:
        - when: "машина стоит в сервисе"
          want: "видеть статус ремонта и счёт в кабинете"
          so: "планировать день без звонков в сервис"
          metrics: []
          screens: ["05", "06"]
```

Решение по метрикам дашборда: главный джоб — первый (сравнение точек по
выручке и загрузке). `defaultMetrics: [revenue, orders, ontime, load]` —
дефолт библиотеки `service`, замены не требует: результат (revenue) +
объём (orders) + срез сроков (ontime) + загрузка (load). Джоб про `repeat`
живёт на экране 02, не в дашборде (правило «граница 01/02 жёсткая»).
